spring.application.name=BankingSystem-Test
server.port=8080

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=banking-group-test
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

banking.kafka.topic.transaction=banking.transactions
banking.kafka.topic.account=banking.accounts
banking.kafka.topic.notification=banking.notifications
banking.kafka.topic.audit=banking.audit

# JWT
banking.jwt.secret=eW91ci0yNTYtYml0LXNlY3JldC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24tbWluLTMyY2hhcnM=
banking.jwt.expiration=86400000
banking.jwt.refresh-expiration=604800000

# Business rules
banking.transaction.daily-limit=50000.00
banking.transaction.single-limit=10000.00

# Logging
logging.level.com.banking=INFO
logging.level.org.springframework.security=WARN

server.error.include-message=always
server.error.include-binding-errors=always

