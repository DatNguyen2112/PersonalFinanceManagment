# ==========================================
# Application
# ==========================================
spring.application.name=BankingSystem
server.port=8080

# ==========================================
# MySQL ? k?t n?i t?i schema ?? t?o b?ng Workbench
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/banking_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=ngoc21062001
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.open-in-view=false

# ==========================================
# Apache Kafka
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.consumer.group-id=banking-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=BankingSystem.*

banking.kafka.topics.sepay-transaction=banking.sepay.transaction
banking.kafka.topics.sepay-sync=banking.sepay.sync
banking.kafka.topics.sepay-budget-alert=banking.sepay.budget-alert
banking.kafka.topics.sepay-bankhub=banking.sepay.bankhub

# ==========================================
# JWT
# ==========================================
banking.jwt.secret=eW91ci0yNTYtYml0LXNlY3JldC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24tbWluLTMyY2hhcnM=
banking.jwt.expiration=86400000
banking.jwt.refresh-expiration=604800000

# ==========================================
# Business rules
# ==========================================
banking.transaction.daily-limit=50000.00
banking.transaction.single-limit=10000.00

# ==========================================
# Logging
# ==========================================
logging.level.com.banking=INFO
logging.level.org.springframework.security=WARN
logging.level.org.apache.kafka=WARN

server.error.include-message=always
server.error.include-binding-errors=always

# ==========================================
# Actuator / Swagger
# ==========================================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.url=/api-docs

