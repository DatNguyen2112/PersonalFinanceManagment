# ==========================================
# Application
# ==========================================
spring.application.name=BankingSystem
server.port=8080

# ==========================================
# MySQL
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.open-in-view=false

# ==========================================
# Kafka ? ??c t? env
# ==========================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

spring.kafka.consumer.group-id=banking-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=BankingSystem.*

banking.kafka.topics.sepay-transaction=banking.sepay.transaction
banking.kafka.topics.sepay-sync=banking.sepay.sync
banking.kafka.topics.sepay-budget-alert=banking.sepay.budget-alert
banking.kafka.topics.sepay-bankhub=banking.sepay.bankhub

# ==========================================
# JWT ? ??c t? env
# ==========================================
banking.jwt.secret=${JWT_SECRET}
banking.jwt.expiration=86400000
banking.jwt.refresh-expiration=604800000

# ==========================================
# Business rules
# ==========================================
banking.transaction.daily-limit=50000.00
banking.transaction.single-limit=10000.00

# ==========================================
# Logging
# ==========================================
logging.level.com.banking=INFO
logging.level.org.springframework.security=WARN
logging.level.org.apache.kafka=WARN

server.error.include-message=always
server.error.include-binding-errors=always

# ==========================================
# Actuator / Swagger
# ==========================================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.url=/api-docs

# Proxy HTTPS
server.forward-headers-strategy=framework

# ==========================================
# SePay ? ??c t? env
# ==========================================
sepay.api.base-url=https://my.sepay.vn/userapi
sepay.api.token=${SEPAY_API_TOKEN}
sepay.api.webhook-secret=${SEPAY_WEBHOOK_SECRET}
sepay.api.rate-limit-per-second=3
sepay.api.sync.cron=0 */15 * * * *
sepay.api.sync.page-size=100

